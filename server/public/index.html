<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AI Squad 보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script>
    // 저장된 테마를 먼저 적용해 깜빡임을 막는다 (기본은 어두운 테마)
    try { const t = localStorage.getItem('squad.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="5" fill="currentColor"/>
        <circle cx="5" cy="9" r="2.6" fill="currentColor" opacity=".7"/><circle cx="27" cy="9" r="2.6" fill="currentColor" opacity=".7"/>
        <circle cx="5" cy="23" r="2.6" fill="currentColor" opacity=".7"/><circle cx="27" cy="23" r="2.6" fill="currentColor" opacity=".7"/>
        <path d="M7 10l6 4M25 10l-6 4M7 22l6-4M25 22l-6-4" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
      </svg>
      <span class="brand-name">AI Squad</span>
    </div>
    <label class="field-inline">
      <span class="sr-only">프로젝트</span>
      <select id="project-select" class="select" aria-label="프로젝트 선택"></select>
    </label>
    <div class="stats" id="stats" aria-live="polite"></div>
    <span id="demo-badge" class="demo-badge" hidden title="scripts/demo-events.mjs 가 만든 시연 기록입니다. 실제 기록이 아닙니다.">시연 데이터</span>
    <nav class="tabs" role="tablist" aria-label="화면">
      <a href="#squad" role="tab" class="tab" id="tab-squad" aria-controls="panel-squad">스쿼드</a>
      <a href="#tasks" role="tab" class="tab" id="tab-tasks" aria-controls="panel-tasks">작업</a>
      <a href="#chat" role="tab" class="tab" id="tab-chat" aria-controls="panel-chat">대화</a>
    </nav>
    <div class="top-right">
      <button type="button" class="confirm-badge" id="confirm-badge" hidden aria-haspopup="dialog">확인 대기 <b id="confirm-count">0</b></button>
      <div class="runners" id="runners" aria-label="실행기 연결 상태"></div>
      <button type="button" id="fx-toggle" class="fx-toggle" aria-pressed="false" title="빛 알갱이·파동·캐릭터 움직임을 줄입니다">효과 줄이기</button>
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="테마 바꾸기" title="테마 바꾸기">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <span id="live" class="live" title="실시간 연결 상태"><i></i><span>연결 중</span></span>
    </div>
  </header>

  <section class="cmdbar" aria-labelledby="order-label">
    <form id="order-form" class="cmd-form">
      <label id="order-label" for="order-text" class="cmd-label">메인 오더에게 지시</label>
      <input id="order-text" class="input" maxlength="1000" autocomplete="off" placeholder="예: 메인 페이지 SEO 문구를 점검하고 검진기관 안내를 보강해 줘">
      <button type="submit" class="btn btn-primary" id="order-submit">계획 만들기</button>
    </form>
    <p class="form-error" id="order-error" role="alert"></p>
    <div class="plan" id="order-plan" hidden aria-live="polite"></div>
  </section>

  <p class="auth-banner" id="auth-banner" role="alert" hidden>접속 토큰이 없습니다. 보드를 띄운 터미널에 찍힌 주소(<code>http://localhost:포트/?t=...</code>)로 다시 여세요.</p>

  <section class="approvals" id="approvals" aria-labelledby="approvals-title" hidden>
    <h2 id="approvals-title">승인 대기 <span class="count" id="approvals-count"></span></h2>
    <ul class="approval-list" id="approval-list"></ul>
  </section>

  <main class="wrap">
    <section id="panel-squad" class="tabpanel" role="tabpanel" aria-labelledby="tab-squad">
      <div class="squad-bar">
        <div class="seg" role="tablist" aria-label="보기 전환">
          <button type="button" role="tab" class="seg-btn" data-view="network" id="tab-network" aria-controls="view-network">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="4.5" cy="6" r="2"/><circle cx="19.5" cy="6" r="2"/><circle cx="4.5" cy="18" r="2"/><circle cx="19.5" cy="18" r="2"/><path d="M6.3 7l3.4 3M17.7 7l-3.4 3M6.3 17l3.4-3M17.7 17l-3.4-3"/></svg>
            연결 보기
          </button>
          <button type="button" role="tab" class="seg-btn" data-view="monitor" id="tab-monitor" aria-controls="view-monitor">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            모니터 보기
          </button>
        </div>
        <ul class="legend" id="legend" aria-label="메시지 종류">
          <li><i class="k-order"></i>지시</li><li><i class="k-handoff"></i>인계</li><li><i class="k-question"></i>질문</li>
          <li><i class="k-answer"></i>답변</li><li><i class="k-report"></i>완료 보고</li><li><i class="k-note"></i>메모</li>
        </ul>
        <div class="filters" id="filters" hidden>
          <label class="field-inline"><span>상태</span>
            <select id="filter-status" class="select">
              <option value="">전체</option><option value="working">일하는 중</option><option value="idle">대기</option><option value="blocked">막힘</option>
            </select>
          </label>
          <label class="field-inline"><span>멤버</span>
            <select id="filter-member" class="select"><option value="">전체</option></select>
          </label>
        </div>
      </div>

      <div id="view-network" class="view net-layout" role="tabpanel" aria-labelledby="tab-network">
        <div class="panel canvas-panel">
          <div class="canvas-wrap" id="canvas-wrap">
            <canvas id="net" role="img" aria-label="스쿼드 연결 그림"></canvas>
            <div class="canvas-tip" id="canvas-tip" hidden></div>
            <p class="net-empty" id="net-empty" hidden>아직 기록이 없습니다 — 위 지시 창에 첫 지시를 입력하세요</p>
          </div>
        </div>
        <div class="cards-col" aria-label="멤버">
          <div class="cards" id="cards"></div>
        </div>
      </div>

      <div id="view-monitor" class="view panel monitor" role="tabpanel" aria-labelledby="tab-monitor" hidden>
        <div class="rows-head" aria-hidden="true">
          <span></span><span>멤버</span><span>상태</span><span>지금 작업</span><span>마지막 이벤트</span><span>대기</span><span></span>
        </div>
        <div id="rows" class="rows scroll"></div>
      </div>
    </section>

    <section id="panel-tasks" class="tabpanel panel" role="tabpanel" aria-labelledby="tab-tasks" hidden>
      <div class="panel-head">
        <h2 id="kanban-title">작업</h2>
        <form id="task-form" class="inline-form">
          <input id="task-title" class="input" maxlength="120" placeholder="새 작업 제목" aria-label="새 작업 제목" required>
          <select id="task-member" class="select" aria-label="담당 멤버"></select>
          <button type="submit" class="btn btn-primary">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>추가
          </button>
        </form>
      </div>
      <div class="kanban" id="kanban"></div>
    </section>

    <section id="panel-chat" class="tabpanel panel convo-panel" role="tabpanel" aria-labelledby="tab-chat" hidden>
      <div class="panel-head">
        <h2 id="convo-title">대화</h2>
        <span class="panel-sub" id="convo-count"></span>
      </div>
      <ol class="convo scroll" id="convo"></ol>
      <form id="msg-form" class="msg-form">
        <div class="msg-route">
          <select id="msg-from" class="select" aria-label="보내는 쪽"></select>
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <select id="msg-to" class="select" aria-label="받는 쪽"></select>
          <select id="msg-kind" class="select" aria-label="종류">
            <option value="order">지시</option><option value="handoff">인계</option><option value="question">질문</option>
            <option value="answer">답변</option><option value="report">완료 보고</option><option value="note" selected>메모</option>
          </select>
        </div>
        <div class="msg-compose">
          <textarea id="msg-text" class="input" rows="2" maxlength="2000" placeholder="메시지 (Ctrl+Enter 로 보내기)" aria-label="메시지 내용" required></textarea>
          <button type="submit" class="btn btn-primary" aria-label="보내기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>보내기
          </button>
        </div>
        <p class="form-error" id="msg-error" role="alert"></p>
      </form>
    </section>
  </main>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-head">
        <div id="modal-avatar"></div>
        <div class="modal-title-wrap">
          <h2 id="modal-title"></h2>
          <p id="modal-sub" class="muted"></p>
        </div>
        <button type="button" class="icon-btn" id="modal-close" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </dialog>

  <dialog class="modal confirm" id="confirm" aria-labelledby="confirm-title">
    <div class="modal-box">
      <div class="modal-head">
        <div id="confirm-avatar"></div>
        <div class="modal-title-wrap">
          <h2 id="confirm-title"></h2>
          <p id="confirm-sub" class="muted"></p>
        </div>
        <span class="confirm-left" id="confirm-left"></span>
      </div>
      <div class="modal-body" id="confirm-body"></div>
      <div class="confirm-actions" id="confirm-actions"></div>
    </div>
  </dialog>

  <div class="popover" id="tech-pop" role="dialog" aria-label="사용 기술" hidden></div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
